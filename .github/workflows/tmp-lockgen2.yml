name: TmpLockgen2
on: [workflow_dispatch]
jobs:
  lockgen:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup show active-toolchain || true
          rustc --version
          cargo --version
      - name: Reset lockfile to upstream base
        run: |
          git config --global user.email noreply@xai.com
          git config --global user.name lockgen
          git remote add upstream https://github.com/xai-org/grok-build.git || true
          git fetch upstream main --depth 1
          git show upstream/main:Cargo.lock > Cargo.lock
      - name: Minimal lockfile update via metadata
        run: |
          cargo metadata --format-version 1 > /dev/null
          git diff --stat Cargo.lock || true
      - name: Verify lockfile consistency
        run: |
          cargo metadata --locked --format-version 1 > /dev/null
          echo LOCK_CONSISTENT
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error
