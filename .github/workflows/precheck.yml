# push/PR 先 cargo check --locked, 禁止拿 Release tag 当第一次编译
name: Precheck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: cargo check --locked
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc
        run: |
          brew install protobuf
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Rust toolchain
        run: |
          rustup show active-toolchain || true
          rustc --version
          cargo --version
          protoc --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: precheck-aarch64-apple-darwin
          cache-on-failure: true

      - name: cargo check
        run: cargo check --locked -p xai-grok-pager-bin
